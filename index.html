<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #fce4ec;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let balloons = [];
let startTime = performance.now();

const COLORS = [
    "#ff9da8",
    "#83cfff",
    "#91dfb0",
    "#ffdb80",
    "#c5a0f5",
    "#ffadd2",
    "#72dce0"
];

const FONT = {
    H: ["10001","10001","10001","11111","10001","10001","10001"],
    A: ["01110","10001","10001","11111","10001","10001","10001"],
    P: ["11110","10001","10001","11110","10000","10000","10000"],
    Y: ["10001","10001","01010","00100","00100","00100","00100"],
    B: ["11110","10001","10001","11110","10001","10001","11110"],
    I: ["11111","00100","00100","00100","00100","00100","11111"],
    R: ["11110","10001","10001","11110","10100","10010","10001"],
    T: ["11111","00100","00100","00100","00100","00100","00100"],
    D: ["11110","10001","10001","10001","10001","10001","11110"]
};

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    createBalloons();
}

window.addEventListener("resize", resize);

function createWord(word, y, scale) {
    const totalWidth = word.length * 6 * scale;
    const startX = (W - totalWidth) / 2;

    for (let i = 0; i < word.length; i++) {
        const pattern = FONT[word[i]];

        for (let row = 0; row < 7; row++) {
            for (let col = 0; col < 5; col++) {

                if (pattern[row][col] === "1") {
                    const x = startX + (i * 6 + col) * scale;
                    const yy = y + row * scale;

                    balloons.push({
                        x,
                        y: yy,
                        color: COLORS[Math.floor(Math.random() * COLORS.length)],
                        delay: Math.random() * 2400,
                        size: 13 + Math.random() * 4
                    });
                }
            }
        }
    }
}

function createBalloons() {
    balloons = [];

    // Увеличенный размер букв
    const scale = Math.min(W / 48, H / 34, 17);

    createWord("HAPPY", H * 0.12, scale);
    createWord("BIRTHDAY", H * 0.48, scale * 0.92);

    startTime = performance.now();
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#f8cbdc");
    gradient.addColorStop(1, "#fff0f5");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
}

function drawBalloon(x, y, color, size) {
    if (size <= 0) return;

    // Шарик
    ctx.beginPath();
    ctx.ellipse(
        x, y, size / 2, size / 1.5,
        0, 0, Math.PI * 2
    );

    ctx.fillStyle = color;
    ctx.fill();

    // Блик
    ctx.beginPath();
    ctx.ellipse(
        x - size / 5,
        y - size / 4,
        size / 10,
        size / 6,
        -0.3, 0, Math.PI * 2
    );

    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fill();

    // Нить
    ctx.beginPath();
    ctx.moveTo(x, y + size / 1.5);
    ctx.quadraticCurveTo(
        x + 5, y + size,
        x + 2, y + size * 2
    );

    ctx.strokeStyle = "rgba(100,80,100,0.65)";
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawGreeting() {
    ctx.save();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = bold ${Math.min(W * 0.065, 42)}px Georgia;

    ctx.fillStyle = "#a64d79";
    ctx.shadowColor = "rgba(255,255,255,0.8)";
    ctx.shadowBlur = 8;

    ctx.fillText(
        "С днём рождения!",
        W / 2,
        H * 0.88
    );

    ctx.restore();
}

function animate(now) {
    drawBackground();

    const elapsed = now - startTime;

    balloons.forEach(balloon => {
        const progress = Math.max(
            0,
            Math.min(1, (elapsed - balloon.delay) / 1800)
        );

        if (progress > 0) {
            const floating =
                Math.sin(elapsed / 400 + balloon.x) * 3;

            const currentY =
                balloon.y + (1 - progress) * 250 + floating;

            drawBalloon(
                balloon.x,
                currentY,
                balloon.color,
                balloon.size * progress
            );
        }
    });

    // Поздравительная надпись внизу
    drawGreeting();

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);

</script>
</body>
</html>
